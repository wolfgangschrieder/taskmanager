name: Build Manager Helper Windows EXE
on:
  push:
    branches: [feature/apex-ui2]
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.0,<7"\n          python -m pip install "pefile>=2023.2.7"
        shell: bash
      - name: Verify Python and QML files
        run: python -m compileall -q ui2.py
      - name: Build portable application
        run: >
          python -m PyInstaller
          --noconfirm --clean --windowed --onedir
          --name "Manager Helper 1.1"
          --add-data "ui2.qml;."
          --add-data "StyledDialog.qml;."
          --add-data "ColorPicker.qml;."
          ui2.py
      - name: Check packaged files
        shell: pwsh
        run: |
          $exe = "dist/Manager Helper 1.1/Manager Helper 1.1.exe"
          if (!(Test-Path $exe)) { throw "EXE missing" }
          foreach ($file in @("ui2.qml", "StyledDialog.qml", "ColorPicker.qml")) {
            $found = Get-ChildItem "dist/Manager Helper 1.1" -Recurse -Filter $file
            if (!$found) { throw "Missing packaged QML: $file" }
          }
      - name: Smoke test packaged EXE on Windows
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          MANAGER_HELPER_SMOKE_TEST: "1"
        run: |
          $exe = (Resolve-Path "dist/Manager Helper 1.1/Manager Helper 1.1.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          if (!$process.WaitForExit(45000)) {
            Stop-Process -Id $process.Id -Force
            throw "Packaged EXE startup timed out after 45 seconds"
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged EXE failed startup smoke test with exit code $($process.ExitCode)"
          }
      - name: Zip portable app
        shell: pwsh
        run: Compress-Archive -Path "dist/Manager Helper 1.1/*" -DestinationPath "Manager-Helper-1.1-Windows.zip"
      - name: Upload Windows portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Manager-Helper-1.1-Windows
          path: Manager-Helper-1.1-Windows.zip
          retention-days: 30
