name: Build Manager Helper Server 2016 RDP
on:
  push:
    branches: [feature/windows-server-2016-rdp]
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6==6.7.3" "pyinstaller>=6.0,<7" "pefile>=2023.2.7"
        shell: bash
      - name: Verify Python and QML files
        run: python -m compileall -q ui2.py
      - name: Build portable application
        run: >
          python -m PyInstaller
          --noconfirm --clean --windowed --onedir
          --name "Manager Helper Server 2016"
          --add-data "ui2.qml;."
          --add-data "StyledDialog.qml;."
          --add-data "ColorPicker.qml;."
          ui2.py
      - name: Check packaged files
        shell: pwsh
        run: |
          $exe = "dist/Manager Helper Server 2016/Manager Helper Server 2016.exe"
          if (!(Test-Path $exe)) { throw "EXE missing" }
          foreach ($file in @("ui2.qml", "StyledDialog.qml", "ColorPicker.qml")) {
            $found = Get-ChildItem "dist/Manager Helper Server 2016" -Recurse -Filter $file
            if (!$found) { throw "Missing packaged QML: $file" }
          }
      - name: Diagnose Qt DLL loading in packaged EXE
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:MANAGER_HELPER_SMOKE_TEST = "1"
          $env:QT_DEBUG_PLUGINS = "1"
          $exe = (Resolve-Path "dist/Manager Helper Server 2016/Manager Helper Server 2016.exe").Path
          $proc = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput "$PWD/stdout.txt" -RedirectStandardError "$PWD/stderr.txt"
          try {
            if (!$proc.WaitForExit(20000)) { throw "Packaged EXE did not exit within 20 seconds" }
            if ($proc.ExitCode -ne 0) { throw "Packaged EXE exit code $($proc.ExitCode)" }
          } finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            if (Test-Path stdout.txt) { Get-Content stdout.txt }
            if (Test-Path stderr.txt) { Get-Content stderr.txt }
          }
      - name: Zip portable app
        shell: pwsh
        run: Compress-Archive -Path "dist/Manager Helper Server 2016/*" -DestinationPath "Manager-Helper-Server-2016-RDP.zip"
      - name: Upload Windows portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Manager-Helper-Server-2016-RDP
          path: Manager-Helper-Server-2016-RDP.zip
          retention-days: 30
