name: Python and QML checks
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install Qt
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py board_widgets.py theme.py ui2.py
      - name: Run isolated SQLite regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -v test_ui2
      - name: Launch QML offscreen
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
          APEX_SMOKE_TEST: '1'
          MANAGER_HELPER_SCREENSHOT: manager-helper-preview.png
          HOME: ${{ runner.temp }}
        run: python ui2.py

      - name: Upload rendered UI preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager-helper-ui-preview
          path: manager-helper-preview.png
          if-no-files-found: warn
